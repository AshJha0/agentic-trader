name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} (numpy backend)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      AGENTIC_TRADER_BACKEND: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Check quant backend
        run: python -c "import agentic_trader.quant as q; assert q.BACKEND == 'python', q.BACKEND"
      - name: Run tests
        run: python -m pytest -ra

  cpp:
    name: C++ core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]" pybind11
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: C++ unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Check quant backend
        run: python -c "import agentic_trader.quant as q; assert q.BACKEND == 'cpp', q.BACKEND"
      - name: Python tests on the C++ backend (includes C++ vs numpy cross-check)
        run: python -m pytest -ra

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# This is the PR gate: every pytest run below skips tests marked `slow` (see pyproject's
# markers) to stay under ten minutes. nightly.yml runs the whole suite.
jobs:
  lint:
    name: Lint (ruff) and types (mypy, blocking on the quant core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e . ruff==0.17.2 mypy==2.4.1
      - name: ruff
        run: ruff check agentic_trader scripts/paper_ops.py tests
      # Blocking on the quant core (the modules every published number goes through): a type
      # error there fails the PR.
      - name: mypy (quant core, blocking)
        run: mypy agentic_trader/quant agentic_trader/risk_model.py agentic_trader/stats.py agentic_trader/oms.py agentic_trader/nyse_calendar.py
      # The rest stays advisory until its Optional-handling backlog is cleared: the log shows
      # the count without blocking a PR.
      - name: mypy (whole package, advisory)
        continue-on-error: true
        run: mypy

  python:
    name: Python ${{ matrix.python-version }} (numpy backend)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      AGENTIC_TRADER_BACKEND: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Hashed lock for this Python when one is committed (scripts/gen_lockfiles.sh), installed
      # with --require-hashes; otherwise a fresh resolve from pyproject's lower bounds.
      - name: Install
        run: |
          lock="requirements/lock-py${{ matrix.python-version }}.txt"
          if [ -f "$lock" ]; then
            python -m pip install --require-hashes -r "$lock"
            python -m pip install -e . --no-deps
          else
            python -m pip install -e ".[dev]"
          fi
      - name: Check quant backend
        run: python -c "import agentic_trader.quant as q; assert q.BACKEND == 'python', q.BACKEND"
      - name: Run tests
        run: python -m pytest -ra -m "not slow" --cov=agentic_trader --cov-report=xml --cov-report=term-missing:skip-covered
      # Report only, not a gate: this tells a contributor which modules (cli.py, data/edgar.py
      # are the largest and most I/O-heavy) have the thinnest coverage, without blocking a PR
      # on a percentage. Collected once (one matrix leg) since coverage does not vary by
      # Python version the way test outcomes occasionally do.
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml

  lock:
    # Proves requirements-lock.txt (the set the published numbers were measured with) still
    # installs, is internally consistent, and passes the suite -- on the one Python it is
    # valid for. The other jobs resolve fresh from pyproject's lower bounds on purpose.
    name: Locked dependencies (Python 3.12, numpy backend)
    runs-on: ubuntu-latest
    env:
      AGENTIC_TRADER_BACKEND: python
      AGENTIC_TRADER_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install from the lock
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Installed versions equal the lock's pins
        run: |
          python - <<'EOF'
          from importlib import metadata
          from packaging.requirements import Requirement
          bad = []
          for line in open("requirements-lock.txt", encoding="utf-8"):
              line = line.split("#", 1)[0].strip()
              if not line:
                  continue
              req = Requirement(line)
              if req.marker is not None and not req.marker.evaluate():
                  continue
              pinned = next(iter(req.specifier)).version
              have = metadata.version(req.name)
              if have != pinned:
                  bad.append(f"{req.name}: lock {pinned}, installed {have}")
          assert not bad, "\n".join(bad)
          print("lock honoured")
          EOF
      - name: Run tests
        run: python -m pytest -ra -m "not slow"

  cpp:
    name: C++ core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]" pybind11
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: C++ unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Check quant backend
        run: python -c "import agentic_trader.quant as q; assert q.BACKEND == 'cpp', q.BACKEND"
      - name: Python tests on the C++ backend (includes C++ vs numpy cross-check)
        run: python -m pytest -ra -m "not slow"

  docs:
    name: Docs (cookbook, diagrams, links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
      - name: Install
        run: |
          python -m pip install -e ".[dev]"
          npm install -g @mermaid-js/mermaid-cli
      - name: Cookbook recipes run (offline ones)
        run: python scripts/run_cookbook.py --offline
      - name: Mermaid diagrams parse and render
        run: python scripts/check_mermaid.py
      - name: Internal links resolve
        run: python scripts/check_links.py

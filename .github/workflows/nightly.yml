name: Nightly full suite

# The PR gate (ci.yml) skips tests marked `slow`; this runs every test, on the oldest and
# newest supported Python, once a night and on demand.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  full:
    name: Full suite, Python ${{ matrix.python-version }} (numpy backend)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    env:
      AGENTIC_TRADER_BACKEND: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run every test
        run: python -m pytest -ra --durations=30

  cpp:
    # The slow-marked tests on the C++ backend, which the PR gate never runs.
    name: Full suite, Python 3.12 (C++ backend)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]" pybind11
      - name: Build the C++ core
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release             -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"             -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
          cmake --build build --config Release --parallel
      - name: Check quant backend
        run: python -c "import agentic_trader.quant as q; assert q.BACKEND == 'cpp', q.BACKEND"
      - name: Run every test
        run: python -m pytest -ra --durations=30

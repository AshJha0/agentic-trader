name: Paper record

# The daily forward paper session (scripts/paper_trade_v09.py), run on the free tier after
# the US close on weekdays.
#
# Two paths, one record. Primary: this workflow. Fallback: the laptop task
# scripts/paper_daily.cmd (Windows Task Scheduler), which commits the same files with the
# same message to main. Run one of them, not both: each run appends a runs.jsonl line, so
# two runners give two lines per session (the ledger itself is append-only and unaffected).
# To fall back, disable this workflow (Actions > Paper record > Disable) and enable the
# laptop task; to return, do the reverse. This runner uses the numpy backend and the locked
# dependency set; the laptop uses the C++ backend, and any difference between the two shows
# up in revisions.csv rather than in the ledger.
#
# Jobs, each with only the permissions it needs:
#   session    reads Yahoo/FRED (the only job with live web data), writes results/paper as an artifact
#   publish    commits the artifact to main as the bot, only when the files changed
#   freshness  fails if the last ledger row (not the as-of a run asked for) is more than 2 business days old
#   report     opens (or comments on) one issue when any of the above fails
on:
  schedule:
    - cron: "30 21 * * 1-5"      # 21:30 UTC: after the 16:00 New York close in both EST (16:30) and EDT (17:30)
  workflow_dispatch:

permissions: {}

concurrency:
  group: paper-record
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      AGENTIC_TRADER_BACKEND: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      # Hashed lock when it exists (requirements/lock-py3.12.txt, made by scripts/gen_lockfiles.sh
      # in the "Lockfiles" workflow), else the v0.8 pin list (no hashes).
      - name: Install from the lock
        run: |
          if [ -f requirements/lock-py3.12.txt ]; then
            python -m pip install --require-hashes -r requirements/lock-py3.12.txt
          else
            python -m pip install -r requirements-lock.txt
          fi
          python -m pip install -e . --no-deps
      # Records the last complete NYSE session on or before New York's yesterday (a Monday run
      # records Friday), refuses a session that may not be final, and refuses to run when the
      # engine differs from docs/evaluation/paper_freeze.json (N1).
      - name: Paper session
        run: python scripts/paper_trade_v09.py
      - name: Mask the runner path in runs.jsonl
        run: python scripts/paper_mask_paths.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: paper-record
          path: |
            results/paper/
            !results/paper/bars/
          retention-days: 30
      # The session's raw Yahoo bars and corporate actions (results/paper/bars/) are not uploaded
      # anywhere (round 2, owner decision D6): Yahoo data may not be redistributed
      # (DATA_LICENSING.md) and a public repository's Actions artifacts are downloadable by
      # others. Only their SHA-256 is published, in runs.jsonl; the laptop's git-ignored copy is
      # the archive.

  publish:
    needs: session
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      # No pip install in the job that can write to main (N3): commit and push are stdlib only.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: paper-record
          path: results/paper/
      # Round 2 (review D6): the artifact was built from an earlier checkout than this one. Refuse
      # to commit unless every append-only file (ledger, vintages, revisions, runs.jsonl) keeps
      # every committed line, in order, and the ledger's rows match the hash chain recorded in
      # runs.jsonl. A commit to results/paper between the two checkouts fails here instead of
      # being reverted silently. Standard library only.
      - name: Append-only check against main
        run: python scripts/paper_ledger_check.py --base HEAD
      # Same files, message and branch as the laptop task; commits only when they changed,
      # and a push that loses a race with another commit rebases and retries, up to 5 pushes
      # with 5/10/20/40 s backoff. The raw bars are not in this artifact and not committed.
      # Pushing to main: the GITHUB_TOKEN push must be allowed by the main ruleset (the bot in
      # its bypass list); "[skip ci]" only skips workflow runs, it does not bypass required
      # checks. If the bypass is removed this step fails and the report job opens an issue.
      - name: Commit and push the record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/paper_ops.py commit --message "paper: daily record [skip ci]"
          python scripts/paper_ops.py push --attempts 5 --backoff 5

  freshness:
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      # stdlib only: freshness counts NYSE sessions with agentic_trader/nyse_calendar.py
      - name: Last recorded session is at most 2 NYSE sessions old
        run: python scripts/paper_ops.py freshness

  report:
    needs: [session, publish, freshness]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const title = "Paper record run failed";
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled paper record failed: ${url}\n\nJobs: session ${{ needs.session.result }}, ` +
                         `publish ${{ needs.publish.result }}, freshness ${{ needs.freshness.result }}.`;
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "paper-record" });
            const existing = open.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ["paper-record"] });
            }

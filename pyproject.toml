[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-trader"
version = "0.14.0"
description = "Agentic multi-agent LLM trading desk for equities and FX: policy-gated tools, evidence, audited reports, C++ quant core"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
data = ["yfinance>=0.2.40"]
cpp = ["pybind11>=2.11", "cmake>=3.18"]
mcp = ["mcp>=2.0"]
rag = ["sentence-transformers>=2.2"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
dev = ["pytest>=7", "pytest-cov>=5", "hypothesis>=6", "mcp>=2.0", "fastapi>=0.110", "httpx>=0.27", "tabulate>=0.9",
       "pyyaml>=6", "setuptools>=70.1"]
all = ["anthropic>=1.0", "yfinance>=0.2.40", "pybind11>=2.11", "pytest>=7", "pytest-cov>=5", "hypothesis>=6",
       "mcp>=2.0", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27", "tabulate>=0.9", "pyyaml>=6", "setuptools>=70.1"]

[project.scripts]
agentic-trader = "agentic_trader.cli:main"

[tool.setuptools.packages.find]
include = ["agentic_trader*"]

# package-data lives in setup.py: the compiled quant core is shipped only when it was built
# for the packaging interpreter, and the wheel is tagged accordingly (see setup.py).

[tool.pytest.ini_options]
testpaths = ["tests"]
# The PR gate runs `-m "not slow"`; the nightly workflow runs everything.
markers = [
    "slow: one of the slowest tests (from --durations); skipped by the PR gate, run nightly",
]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
# Conservative: pyflakes and the pycodestyle error classes (real bugs and syntax-level
# issues), no style or import-order rules.
select = ["E4", "E7", "E9", "F"]
# `l` for a low/level/length in the numeric kernels reads fine next to `h` and `c`
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# analysts.py keeps the cross-sectional cache's imports beside the cache they serve; the
# file is owned by another work item, so it is not reordered here
"agentic_trader/agents/analysts.py" = ["E402"]

[tool.mypy]
# Lenient on purpose: catch outright type errors in agentic_trader/ without demanding
# annotations; tighten per module as it earns it.
python_version = "3.10"
files = ["agentic_trader"]
ignore_missing_imports = true
follow_imports = "silent"

[tool.coverage.run]
source = ["agentic_trader"]
# Coverage is collected on the AGENTIC_TRADER_BACKEND=python CI job, so quant/pycore.py (the
# numpy twin of the C++ core) is exercised there like everything else; nothing to omit.

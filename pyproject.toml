[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-trader"
version = "0.12.0"
description = "Agentic multi-agent LLM trading desk for equities and FX: policy-gated tools, evidence, audited reports, C++ quant core"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
data = ["yfinance>=0.2.40"]
cpp = ["pybind11>=2.11", "cmake>=3.18"]
mcp = ["mcp>=2.0"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
dev = ["pytest>=7", "pytest-cov>=5", "hypothesis>=6", "mcp>=2.0", "fastapi>=0.110", "httpx>=0.27", "tabulate>=0.9",
       "pyyaml>=6", "setuptools>=70.1"]
all = ["anthropic>=1.0", "yfinance>=0.2.40", "pybind11>=2.11", "pytest>=7", "pytest-cov>=5", "hypothesis>=6",
       "mcp>=2.0", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27", "tabulate>=0.9", "pyyaml>=6", "setuptools>=70.1"]

[project.scripts]
agentic-trader = "agentic_trader.cli:main"

[tool.setuptools.packages.find]
include = ["agentic_trader*"]

# package-data lives in setup.py: the compiled quant core is shipped only when it was built
# for the packaging interpreter, and the wheel is tagged accordingly (see setup.py).

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["agentic_trader"]
# Coverage is collected on the AGENTIC_TRADER_BACKEND=python CI job, so quant/pycore.py (the
# numpy twin of the C++ core) is exercised there like everything else; nothing to omit.

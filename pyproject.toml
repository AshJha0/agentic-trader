[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-trader"
version = "0.19.0"
description = "Agentic multi-agent LLM trading desk for equities and FX: policy-gated tools, evidence, audited reports, C++ quant core"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.1"]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
data = ["yfinance>=0.2.40"]
cpp = ["pybind11>=2.11", "cmake>=3.18"]
mcp = ["mcp>=2.0"]
rag = ["sentence-transformers>=2.2"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
otel = ["opentelemetry-sdk>=1.20", "opentelemetry-exporter-otlp-proto-http>=1.20"]
approval = ["cryptography>=42"]
dev = ["pytest>=7", "pytest-cov>=5", "hypothesis>=6", "mcp>=2.0", "fastapi>=0.110", "httpx>=0.27", "tabulate>=0.9",
       "pyyaml>=6", "setuptools>=70.1", "cryptography>=42"]
all = ["anthropic>=1.0", "yfinance>=0.2.40", "pybind11>=2.11", "pytest>=7", "pytest-cov>=5", "hypothesis>=6",
       "mcp>=2.0", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27", "tabulate>=0.9", "pyyaml>=6", "setuptools>=70.1",
       "cryptography>=42"]

[project.scripts]
agentic-trader = "agentic_trader.cli:main"

[tool.setuptools.packages.find]
include = ["agentic_trader*"]

# package-data lives in setup.py: the compiled quant core is shipped only when it was built
# for the packaging interpreter, and the wheel is tagged accordingly (see setup.py).

[tool.pytest.ini_options]
testpaths = ["tests"]
# The PR gate runs `-m "not slow"`; the nightly workflow runs everything.
markers = [
    "slow: one of the slowest tests (from --durations); skipped by the PR gate, run nightly",
]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
# pyflakes, the pycodestyle error classes, flake8-bugbear (B) and flake8-bandit (S): real
# bugs, syntax-level issues and security smells; no style or import-order rules.
select = ["E4", "E7", "E9", "F", "B", "S"]
ignore = [
    "E741",   # `l` for a low/level/length in the numeric kernels reads fine next to `h` and `c`
    "B905",   # zip() without strict=: adding strict= changes behaviour; each call site keeps equal lengths by construction
    "S101",   # assert states internal invariants and narrows types; the package is never run under python -O
    "S311",   # random is used for seeded simulation, sampling and jitter, never for secrets
]

[tool.ruff.lint.per-file-ignores]
# analysts.py keeps the cross-sectional cache's imports beside the cache they serve; the
# file is owned by another work item, so it is not reordered here. S112: a symbol whose
# cross-sectional inputs fail to load is skipped on purpose.
"agentic_trader/agents/analysts.py" = ["E402", "S112"]
# Tests: subprocess calls with fixed argv, fake credentials, bind-all test servers, md5 as a
# fixture checksum, expressions evaluated only for their exception, loop closures called in place.
"tests/**" = ["S104", "S105", "S106", "S108", "S324", "S603", "S607", "B006", "B007", "B017", "B018", "B023"]
# Scripts run maintainer tools (git, gpg, mmdc, python) with fixed argv, and check_links opens
# only the http(s) links it found in the repository's docs.
"scripts/**" = ["S603", "S607", "S310"]
# gen_counts.py parses the coverage.xml that pytest-cov just wrote in the same job (not
# untrusted input); the file is owned by another work item.
"scripts/gen_counts.py" = ["S314"]
# FastAPI's documented dependency-injection idiom is a Depends() call in the default.
"agentic_trader/agentic/api.py" = ["B008"]
# The interpolated SQL fragments are module constants; every value is a bound parameter.
"agentic_trader/agentic/store.py" = ["S608"]
# Fixed https endpoints (SEC EDGAR, FRED) and a local model server URL from configuration.
"agentic_trader/data/edgar.py" = ["S310"]
"agentic_trader/data/edgar_text.py" = ["S310"]
"agentic_trader/data/fred.py" = ["S310"]
"agentic_trader/local_llm.py" = ["S310"]
# `git rev-parse` with fixed argv to record the commit a result was produced on.
"agentic_trader/provenance.py" = ["S603", "S607"]
# Best-effort cleanup / optional enrichment: a failure there must not fail the run.
"agentic_trader/agentic/redteam_v2.py" = ["S110"]
"agentic_trader/graph.py" = ["S112"]
"agentic_trader/evaluation.py" = ["S110"]   # owned by another work item

[tool.mypy]
# Blocking in CI on the whole package. Bodies of unannotated functions are checked too, and
# every `type: ignore` must carry an error code and still be needed. Tighten further
# (disallow_untyped_defs) per module as it earns it.
python_version = "3.10"
files = ["agentic_trader"]
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
enable_error_code = ["ignore-without-code"]

[tool.coverage.run]
source = ["agentic_trader"]
# Coverage is collected on the AGENTIC_TRADER_BACKEND=python CI job, so quant/pycore.py (the
# numpy twin of the C++ core) is exercised there like everything else; nothing to omit.
branch = true

[tool.coverage.report]
# A floor CI enforces (every matrix leg runs --cov). Line+branch coverage measured locally
# on the full suite at v0.19 is reported in the CHANGELOG; the floor sits a few points below
# it because CI skips the slow-marked tests.
fail_under = 90
